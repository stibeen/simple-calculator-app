<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Calculator App</h1>
    <div id="container">
        <input type="text" id="input-field" />
        <p id="text-content"></p>
        <button id="calculate-btn">=</button>
        <button id="open-parentheses-btn">(</button>
        <button id="close-parentheses-btn">)</button>
        <div id="numbers">
            <button id="button-one">1</button>
            <button id="button-two">2</button>
            <button id="button-three">3</button>
            <button id="button-four">4</button>
            <button id="button-five">5</button>
            <button id="button-six">6</button>
            <button id="button-seven">7</button>
            <button id="button-eight">8</button>
            <button id="button-nine">9</button>
            <button id="button-zero">0</button>
        </div>
        <button id="button-clear">Clear</button>
        <button id="button-delete">Delete</button>
        <div id="operators">
            <button id="button-add">+</button>
            <button id="button-subtract">-</button>
            <button id="button-multiply">*</button>
            <button id="button-divide">/</button>
        </div>
    </div>
</body>
<script src="index.js"></script>

</html>
