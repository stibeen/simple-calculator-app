<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Calculator App</h1>
    <div id="container">
        <input type="text" id="input-field" readonly/>
        <button id="calculate-btn">=</button>
        <button onclick="charToAppend('(')">(</button>
        <button onclick="charToAppend(')')">)</button>
        <div id="numbers">
            <button onclick="charToAppend('1')">1</button>
            <button onclick="charToAppend('2')">2</button>
            <button onclick="charToAppend('3')">3</button>
            <button onclick="charToAppend('4')">4</button>
            <button onclick="charToAppend('5')">5</button>
            <button onclick="charToAppend('6')">6</button>
            <button onclick="charToAppend('7')">7</button>
            <button onclick="charToAppend('8')">8</button>
            <button onclick="charToAppend('9')">9</button>
            <button onclick="charToAppend('0')">0</button>
        </div>
        <button onclick="clearDisplay()">Clear</button>
        <button onclick="deleteChar()">Delete</button>
        <div id="operators">
            <button onclick="charToAppend('+')">+</button>
            <button onclick="charToAppend('-')">-</button>
            <button onclick="charToAppend('*')">*</button>
            <button onclick="charToAppend('/')">/</button>
        </div>
        <div>
            <h2>History</h1> <button id="clear-history-btn">Clear history</button>
            <ul id="history-list"></ul>
        </div>
    </div>
</body>
<script src="index.js"></script>

</html>
